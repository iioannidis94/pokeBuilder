<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Κύριο αρχείο εμφάνισης και στυλ CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ΚΥΡΙΑ ΜΠΑΡΑ ΠΛΟΗΣΗΣ (HEADER) -->
<header>
  <!-- Λογότυπο εφαρμογής -->
  <div class="logo">POKÉ<span>DEX</span></div>
  
  <!-- Μπάρα αναζήτησης Pokémon -->
  <div class="sw">
    <span class="si">🔍</span>
    <input type="text" id="search" placeholder="Search: name, #number, type…" autocomplete="off" spellcheck="false">
  </div>
    
  <!-- ΚΟΥΜΠΙΑ ΠΛΟΗΣΗΣ (Ομαδοποιημένα δεξιά με .nav-buttons) -->
  <div class="nav-buttons">
    <button class="teamBtn" id="myTeamBtn" type="button">Team Builder</button>
    <button class="teamBtn dexBtn" id="dexViewBtn" type="button">Weaknesses / Counters</button>
    <button class="teamBtn" id="calcViewBtn" type="button">Battle Calculator</button>
    <button class="teamBtn" id="trainerTowerBtn" type="button" style="border-color: #f59f00; color: #f59f00;">Trainer Tower</button>
    <button class="teamBtn" onclick="window.location.href='games/index.html'" type="button" style="border-color: #38d878; background: linear-gradient(135deg, #38d878, #28a75e); color: #171015; box-shadow: 0 0 20px rgba(56, 216, 120, 0.3);">
      🎮 GAMES
    </button>
  </div>
</header>

<!-- ΦΙΛΤΡΑ ΑΝΑΖΗΤΗΣΗΣ & ΤΥΠΩΝ (TYPES & FORMS) -->
<div class="filters-wrapper">
  <!-- Κουμπιά τύπων Pokémon (Γεμίζουν αυτόματα δυναμικά από το dex.js) -->
  <div class="tfs" id="tf"></div>
  
  <!-- Φίλτρα ειδικών μορφών (Mega, Alola, Galar, κλπ.) -->
  <div class="form-filters">
    <button class="form-btn" data-form="mega">Mega</button>
    <button class="form-btn" data-form="alola">Alola</button>
    <button class="form-btn" data-form="galar">Galar</button>
    <button class="form-btn" data-form="hisui">Hisui</button>
    <button class="form-btn" data-form="paldea">Paldea</button>
    <button class="form-btn" data-form="therian">Therian</button>
  </div>
</div>

<!-- ΜΠΑΡΑ ΣΤΑΤΙΣΤΙΚΩΝ & ΠΛΗΡΟΦΟΡΙΩΝ -->
<div class="sb"><span id="cnt">Loading...</span></div>

<!-- ΚΥΡΙΟΣ ΚΟΡΜΟΣ ΕΜΦΑΝΙΣΗΣ CARDS POKÉMON -->
<main><div id="grid"></div></main>

<!-- PARTE 1: TEAM BUILDER OVERLAY (Διαχείριση Ομάδας) -->
<div class="teamOverlay" id="teamOverlay" aria-hidden="true">
  <section class="teamPanel" role="dialog" aria-modal="true" aria-labelledby="teamTitle">
    <!-- Μπάρα εργαλείων Team Builder -->
    <div class="teamTop">
      <h2 class="teamTitle" id="teamTitle">TEAM BUILDER</h2>
      
      <select id="teamSelect" class="teamTool" style="margin: 0 10px; padding: 6px; cursor: pointer;"></select>
      <button id="addTeamBtn" class="teamTool" type="button">+ New Team</button>
      <button id="renameTeamBtn" class="teamTool" type="button" style="margin-right: auto;">Rename</button>
      
      <button class="teamTool" id="bossesBtn" type="button" style="border-color: #ff6b6b; color: #ff6b6b; background: rgba(255,107,107,0.1);">⚔️ Bosses</button>
      <button class="teamTool" id="autoTeamBtn" type="button" style="border-color: #38d878; color: #38d878; background: rgba(56,216,120,0.1);">✨ Auto-Build 6</button>
      <button class="teamTool" id="teamExport" type="button">Export JSON</button>
      <label class="teamTool importTool" for="teamImport">Import JSON</label>
      <input id="teamImport" type="file" accept="application/json,.json" hidden>
      <button class="teamReset" id="teamReset" type="button">Clear Team</button>
      <button class="teamClose" id="teamClose" type="button">Close</button>
    </div> 
    <!-- Περιεχόμενο Team Builder (Λίστα επιλογής & Slots ομάδας) -->
    <div class="teamBody">
        <aside class="teamPicker">
            <input class="teamSearch" id="teamSearch" type="text" placeholder="Search Pokémon to add..." autocomplete="off" spellcheck="false">
            <div class="teamList" id="teamList"></div>
        </aside>
        <section class="teamSlots" id="teamSlots"></section>
    </div>
  </section>
</div>

<!-- PART 2: BATTLE CALCULATOR OVERLAY (Υπολογιστής Μάχης) -->
<div class="calcOverlay" id="calcOverlay" aria-hidden="true">
  <section class="calcViewPanel" aria-labelledby="calcViewTitle">
    <div class="teamTop">
      <h2 class="teamTitle" id="calcViewTitle">BATTLE CALCULATOR</h2>
      <button class="calcClose" id="calcClose" type="button">Close</button>
    </div>
    <div class="calcViewBody" id="calcViewContent"></div>
  </section>
</div>

<!-- PART 3: TRAINER TOWER OVERLAY (Αυτόνομο παράθυρο Trainer Tower) -->
<div class="calcOverlay" id="trainerTowerOverlay">
  <section class="calcViewPanel" aria-labelledby="trainerTowerTitle">
    <div class="teamTop">
      <h2 class="teamTitle" id="trainerTowerTitle" style="color: #f59f00;">TRAINER TOWER</h2>
      <button class="calcClose" id="trainerTowerClose" type="button">Close</button>
    </div>
    <div class="calcViewBody" id="trainerTowerContent" style="padding: 20px; display: block;">
      <!-- Εδώ κάνει render δυναμικά το UI το script του trainer_tower.js -->
    </div>
  </section>
</div>

<!-- PART 4: BOSSES MODAL (Παράθυρο επιλογής Bosses) -->
<div id="bossesOverlay" aria-hidden="true" style="
    position:fixed; inset:0; z-index:9999;
    background:#05050c; align-items:center; justify-content:center;
    transition:.2s;
" role="dialog" aria-modal="true" aria-labelledby="bossesTitle">
  <section style="
    background:var(--panel); border:1px solid var(--brd); border-radius:16px;
    width:min(96vw, 900px); max-height:90vh; display:flex; flex-direction:column;
    overflow:hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  ">
    <!-- Επικεφαλίδα Modal -->
    <div style="display:flex; align-items:center; padding:14px 20px; border-bottom:1px solid var(--brd); gap:10px; flex-shrink:0;">
      <span style="font-size:20px;">⚔️</span>
      <h2 id="bossesTitle" style="margin:0; font-size:16px; font-weight:900; color:var(--txt); flex:1;">Boss Trainers</h2>
      <button type="button" onclick="closeBossesModal()" style="background:none; border:none; color:var(--dim); font-size:22px; cursor:pointer; line-height:1; padding:0 4px;" aria-label="Close">×</button>
    </div>
    <!-- Κεντρικό περιεχόμενο Bosses (Λίστα & Λεπτομέρειες) -->
    <div style="display:flex; flex:1; overflow:hidden;">
      <div id="bossListPanel" style="width:220px; flex-shrink:0; overflow-y:auto; border-right:1px solid var(--brd); background:var(--bg);"></div>
      <div id="bossDetailPanel" style="flex:1; overflow-y:auto;"></div>
    </div>
  </section>
</div>

<!-- ΦΟΡΤΩΣΗ SCRIPTS & ΑΡΧΕΙΩΝ ΔΕΔΟΜΕΝΩΝ -->

<!-- 1. Βασικά Δεδομένα (Type Chart) -->
<script src="data/TC.js" defer></script>

<!-- 2. Μεγάλα αρχεία βάσης Pokémon & Στατιστικών -->
<script src="data/pokemon-core.js" defer></script>
<script src="data/base_stats.js" defer></script>
<script src="data/abilities.js" defer></script>
<script src="data/sprites.js" defer></script>

<!-- 3. Δεδομένα Κινήσεων & Bosses -->
<script src="data/moves.js" defer></script>
<script src="data/move-info.js" defer></script>
<script src="data/move-metadata.js" defer></script>
<script src="data/bosses.js" defer></script>
<script src="data/move-evolutions.js" defer></script>
<script src="data/items.js"></script>
<!-- 4. Βοθητικά εργαλεία (Utils) -->
<script src="utils.js" defer></script>

<!-- 5. Λογική Ομάδας (Team Core) -->
<script src="team/team-core.js" defer></script>

<!-- 6. Αρχεία Διεπαφής & Αναλύσεων Ομάδας -->
<script src="team/team-io.js" defer></script>
<script src="team/team-ai.js" defer></script>
<script src="team/team-recommender.js" defer></script>
<script src="team/team-analytics.js" defer></script>
<script src="team/team-ui.js" defer></script>
<script src="team/team-oop.js" defer></script>
<script src="team/team-bosses.js" defer></script>

<!-- 7. Αποκλειστικό Script για το Trainer Tower -->
<script src="team/trainer_tower.js" defer></script>

<!-- 8. Κύρια λογική Pokédex -->
<script src="dex.js" defer></script>

<!-- Εγγραφή Service Worker για λειτουργία Offline (PWA) -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>

<!-- ΣΚΡΙΠΤ ΠΛΟΗΣΗΣ: Αυτόματη κύλιση (Scroll) στην κορυφή κατά την αλλαγή καρτέλας -->
<script>
document.querySelectorAll('header button, .nav-buttons button').forEach(btn => {
    btn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'instant' });
    });
});
</script>

</body>
</html>
