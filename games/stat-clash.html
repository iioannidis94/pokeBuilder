<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stat Clash | Pokémon Games</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="games.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <a href="index.html" class="back-btn">⬅ Games Hub</a>
            <div class="score-board">
                <span>Score: <b id="current-score" style="color:var(--yel)">0</b></span>
                <span style="margin: 0 15px;">Streak: <b id="streak-score" style="color:#ff6b6b">0 🔥</b></span>
                <span>High Score: <b id="high-score" style="color:var(--yel)">0</b></span>
            </div>
        </header>

        <main class="game-arena">
            <div class="question-banner">
                Which Pokémon has higher <span id="target-stat" class="stat-highlight">...</span>?
            </div>

            <div class="pokemon-matchup" id="matchup-container">
                <!-- Pokémon 1 -->
                <div class="poke-card" id="card-1" onclick="choosePokemon(0)">
                    <div class="poke-img-wrap" id="poke-img-wrap-1"></div>
                    <h3 id="poke-name-1" class="pn">---</h3>
                    <div class="poke-types tr" id="poke-types-1" style="justify-content:center; margin-top:5px;"></div>
                    <div class="stat-result" id="stat-val-1">??</div>
                </div>

                <div class="vs-circle">VS</div>

                <!-- Pokémon 2 -->
                <div class="poke-card" id="card-2" onclick="choosePokemon(1)">
                    <div class="poke-img-wrap" id="poke-img-wrap-2"></div>
                    <h3 id="poke-name-2" class="pn">---</h3>
                    <div class="poke-types tr" id="poke-types-2" style="justify-content:center; margin-top:5px;"></div>
                    <div class="stat-result" id="stat-val-2">??</div>
                </div>
            </div>

            <div id="feedback-msg" class="feedback-msg"></div>
            <button id="next-btn" class="next-btn hidden" onclick="startNewRound()">Next Round ➡</button>
        </main>
    </div>

    <!-- Φόρτωση των δεδομένων -->
    <script src="../data/TC.js"></script>
    <script src="../data/pokemon-core.js"></script>
    <script src="../data/base_stats.js"></script>
    <script src="../data/sprites.js"></script>
    <script src="../utils.js"></script>
    
    <!-- Λογική Παιχνιδιού -->
    <script src="stat-clash.js"></script>
</body>
</html>
