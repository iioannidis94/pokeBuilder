<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Matchup | Pokémon Games</title>
    <!-- Το favicon είναι έναν φάκελο πίσω -->
    <link rel="icon" type="image/svg+xml" href="../Pikachu SVG File.svg">
    <!-- Το βασικό CSS είναι 2 φακέλους πίσω -->
    <link rel="stylesheet" href="../../styles.css">
    <!-- Το games.css είναι 1 φάκελο πίσω -->
    <link rel="stylesheet" href="../games.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <a href="../index.html" class="back-btn">⬅ Games Hub</a>
            <div class="score-board">
                <span>Score: <b id="current-score" style="color:var(--yel)">0</b></span>
                <span style="margin: 0 15px;">Streak: <b id="streak-score" style="color:#ff6b6b">0 🔥</b></span>
                <span>High Score: <b id="high-score" style="color:var(--yel)">0</b></span>
            </div>
        </header>

        <main class="game-arena">
            <div class="question-banner">
                Which type is <span class="stat-highlight" style="color: #ff4466;">SUPER EFFECTIVE</span> against this Pokémon?
            </div>

            <div class="pokemon-matchup" id="matchup-container" style="justify-content: center; margin-bottom: 20px;">
                <!-- Target Pokémon -->
                <div class="poke-card" id="target-card" style="max-width: 300px; width: 100%; cursor: default;">
                    <div class="poke-img-wrap" id="poke-img-wrap"></div>
                    <h3 id="poke-name" class="pn" style="font-size: 18px;">---</h3>
                    <div class="poke-types tr" id="poke-types" style="justify-content:center; margin-top:5px;"></div>
                </div>
            </div>

            <!-- Type Buttons -->
            <div class="type-options-grid" id="options-container">
                <!-- Buttons injected via JS -->
            </div>

            <div id="feedback-msg" class="feedback-msg"></div>
            <button id="next-btn" class="next-btn hidden" onclick="startNewRound()">Next Round ➡</button>
        </main>
    </div>

    <!-- Data & Utils (2 φακέλους πίσω) -->
    <script src="../../data/TC.js"></script>
    <script src="../../data/pokemon-core.js"></script>
    <script src="../../data/sprites.js"></script>
    <script src="../../utils.js"></script>
    
    <!-- Game Logic (στον ίδιο φάκελο) -->
    <script src="type-matchup.js"></script>
</body>
</html>
