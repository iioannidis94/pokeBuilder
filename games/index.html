
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Games Hub</title>
    <link rel="stylesheet" href="games.css">
</head>
<body>
    <div class="games-hub-container">
        <header class="hub-header">
            <a href="../index.html" class="back-btn">⬅ Επιστροφή στην Αρχική</a>
            <h1>Pokémon Mini Games</h1>
            <p>Διάλεξε ένα παιχνίδι και δοκίμασε τις γνώσεις σου!</p>
        </header>

        <div class="games-grid">
            <!-- Game 1 Card -->
            <div class="game-card">
                <div class="game-badge">New</div>
                <h2>Stat Clash ⚔️</h2>
                <p>Σύγκρινε δύο τυχαία Pokémon και μάντεψε ποιο έχει μεγαλύτερο base stat (HP, Attack, Speed κλπ.)!</p>
                <a href="stat-clash.html" class="play-btn">Παίξε Τώρα</a>
            </div>

            <!-- Placeholder για μελλοντικά games -->
            <div class="game-card locked">
                <h2>Type Matchup Quiz 🛡️</h2>
                <p>Σύντομα διαθέσιμο...</p>
                <button class="play-btn" disabled>Locked</button>
            </div>
        </div>
    </div>
</body>
</html>
