<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Games Hub</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="games.css">
</head>
<body>
    <div class="games-hub-container">
        <header class="hub-header">
            <a href="../index.html" class="back-btn">⬅ Back to Home</a>
            <h1 style="color: var(--yel); font-family: 'Press Start 2P', monospace; font-size: 16px;">Pokémon Mini Games</h1>
            <p style="color: var(--dim); margin-top: 5px;">Choose a game and test your knowledge!</p>
        </header>

        <div class="games-grid">
            <!-- Game 1 Card -->
            <div class="game-card">
                <div class="game-badge">New</div>
                <h2 style="color: var(--txt);">Stat Clash ⚔️</h2>
                <p style="color: var(--dim); font-size: 14px; margin: 10px 0;">Compare two random Pokémon and guess which one has the higher base stat!</p>
                <a href="stat-clash.html" class="play-btn">Play Now</a>
            </div>

            <!-- Placeholder for future games -->
            <div class="game-card locked">
                <h2 style="color: var(--txt);">Type Matchup Quiz 🛡️</h2>
                <p style="color: var(--dim); font-size: 14px; margin: 10px 0;">Coming soon...</p>
                <button class="play-btn" disabled style="background: var(--dim); cursor: not-allowed;">Locked</button>
            </div>
        </div>
    </div>
</body>
</html>
